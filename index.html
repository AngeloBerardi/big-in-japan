<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e2412b">
<meta name="robots" content="noindex,nofollow">
<title>Big in Japan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<style>
/* VOICE: compagno di viaggio moderno, fotografico, leggibile al volo per strada
   IDEA: come un'app di mappe: il programma a sinistra, la mappa vera a destra; su telefono la mappa a tutto schermo con le schede delle tappe che scorrono in basso
   PICTURE: foto reali dei luoghi (Wikipedia/Wikimedia Commons) e la mappa con switch Mappa/Satellite/Notte e le linee ferroviarie
   COLOUR and TYPE: bianco, inchiostro, vermiglio dei torii come accento, colori per giornata; Zen Kaku Gothic New per i titoli, Inter per il testo
   LAYOUT: desktop 480px + mappa; mobile con barra in basso Giorni/Mappa/Info */
:root{--bg:#fff;--ink:#15171c;--muted:#626875;--line:#e8e8ec;--soft:#f4f4f6;--ver:#e2412b;--sun:#ffc533;--glass:rgba(255,255,255,.9);--sh:0 8px 30px rgba(15,20,35,.14);color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
h1,h2,h3,.disp{font-family:"Zen Kaku Gothic New",Inter,sans-serif;font-weight:900;letter-spacing:-.01em}
a{color:var(--ver)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{display:grid;grid-template-columns:480px minmax(0,1fr);height:100%}
#side{overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--line);position:relative}
#mapwrap{position:relative;height:100%}
#map{position:absolute;inset:0;background:#e9eef2}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .brand{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:18px;margin-right:auto;text-decoration:none;color:var(--ink)}
.top .brand span{color:var(--ver)}
.top a.tab{padding:8px 12px;border-radius:99px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.top a.tab[aria-current]{background:var(--ink);color:#fff}
.pad{padding:18px 18px 40px}
/* hero */
.hero{position:relative;height:300px;overflow:hidden;background:#33306e;color:#fff}
.hero img,.cover img,.ph img{width:100%;height:100%;object-fit:cover;display:block}
.hero .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72))}
.hero .tx{position:absolute;left:18px;right:18px;bottom:18px}
.hero h1{font-size:44px;line-height:1;margin:0 0 6px}
.hero p{margin:0;opacity:.92}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#3a2a00;font-weight:700;font-size:13px;padding:5px 12px;border-radius:99px;margin-top:12px}
.credit{position:absolute;right:8px;top:8px;font-size:11px;color:#fff;opacity:.8;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:4px;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 22px}
.stats div{background:var(--soft);border-radius:14px;padding:12px}
.stats b{display:block;font-family:"Zen Kaku Gothic New";font-size:26px;line-height:1.1}
.stats span{font-size:12.5px;color:var(--muted)}
h2.sec{font-size:24px;margin:26px 0 12px}
/* day cards */
.days{display:grid;gap:12px}
.dc{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;padding:8px;border-radius:16px;border:1px solid var(--line);background:var(--bg);transition:box-shadow .2s}
.dc:hover{box-shadow:var(--sh)}
.dc .ph{height:84px;border-radius:12px;overflow:hidden;background:var(--soft);position:relative}
.dc .n{position:absolute;left:6px;top:6px;background:var(--c);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:2px 8px}
.dc small{color:var(--c);font-weight:700;font-size:12.5px}
.dc strong{display:block;font-size:16px;line-height:1.25;margin:2px 0}
.dc em{font-style:normal;color:var(--muted);font-size:13px}
.dc.today{border-color:var(--ver);box-shadow:0 0 0 2px var(--ver)}
/* day view */
.cover{position:relative;height:250px;background:var(--soft);overflow:hidden}
.cover .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.75))}
.cover .tx{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.cover .tx small{font-weight:700;background:var(--c);padding:3px 10px;border-radius:99px;font-size:12.5px}
.cover h1{font-size:30px;line-height:1.1;margin:10px 0 0;text-wrap:balance}
.daynav{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;border-bottom:1px solid var(--line);scrollbar-width:none}
.daynav a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;padding:7px 11px;border-radius:99px;background:var(--soft)}
.daynav a[aria-current]{background:var(--c);color:#fff}
.lead{color:var(--muted);margin:0 0 12px}
.alert{background:#fff5d6;border-radius:12px;padding:11px 13px;font-size:14px;margin:8px 0}
.slot{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:13px;letter-spacing:.02em;color:var(--c);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.slot::after{content:"";flex:1;height:1px;background:var(--line)}
.stop{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;margin-bottom:12px}
.stop .t{font-weight:700;font-size:15px;padding-top:4px;text-align:right}
.stop .t small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);cursor:pointer;transition:box-shadow .2s}
.card:hover,.card.sel{box-shadow:var(--sh)}
.card.sel{border-color:var(--c)}
.card .ph{height:130px;background:var(--soft);position:relative}
.card .bd{padding:11px 13px 12px}
.card h4{margin:0 0 3px;font-size:16px;line-height:1.3}
.card p{margin:4px 0;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.tg{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.tg.prenotato{background:var(--ver);color:#fff}
.tg.mappa{background:#e7ecfb;color:#2c3e8f}.tg.piano{background:#15171c;color:#fff}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:11.5px;font-weight:700}
.sta{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.sta b{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);min-height:38px}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.sleep{margin-top:16px;padding:12px 14px;background:var(--soft);border-radius:14px;font-size:14px}
/* map overlays */
.mtop{position:absolute;left:12px;right:12px;top:12px;z-index:500;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.mtop>*{pointer-events:auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.chip{flex:none;border:0;background:var(--glass);backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:99px;padding:8px 13px;font-weight:600;font-size:13px;min-height:38px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.layers{position:absolute;right:12px;top:62px;z-index:500;display:flex;flex-direction:column;gap:8px}
.fab{width:46px;height:46px;border-radius:14px;border:0;background:var(--glass);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.16);display:grid;place-items:center}
.fab svg{width:22px;height:22px}
.fab.on{background:var(--ink);color:#fff}
.lpanel{position:absolute;right:66px;top:62px;z-index:600;background:var(--bg);border-radius:16px;box-shadow:var(--sh);padding:12px;width:230px;display:none}
.lpanel.on{display:block}
.lpanel h5{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lgrid button{border:2px solid transparent;background:none;padding:0;border-radius:12px;font-size:12px;font-weight:600;text-align:center}
.lgrid button i{display:block;height:52px;border-radius:10px;margin-bottom:4px;background-size:cover}
.lgrid button[aria-pressed=true]{border-color:var(--ver)}
.lpanel label{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 0}
.near{position:absolute;left:12px;bottom:16px;z-index:500;background:var(--glass);backdrop-filter:blur(12px);border-radius:16px;box-shadow:var(--sh);padding:12px 14px;max-width:360px;font-size:14px;display:none}
.near.on{display:block}
.near b{font-weight:700}
.near .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:18px;color:var(--muted)}
.carousel{position:absolute;left:0;right:0;bottom:12px;z-index:500;display:none;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;scrollbar-width:none}
.carousel .cc{flex:0 0 82%;scroll-snap-align:center;display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;background:var(--bg);border-radius:16px;box-shadow:var(--sh);padding:8px;border:2px solid transparent}
.carousel .cc.sel{border-color:var(--c)}
.carousel .cc .ph{height:92px;border-radius:12px;overflow:hidden;background:var(--soft)}
.carousel .cc b{display:block;font-size:15px;line-height:1.25}
.carousel .cc small{color:var(--c);font-weight:700}
.carousel .cc .acts{margin-top:6px}
.carousel .cc .btn{padding:6px 10px;min-height:34px;font-size:12.5px}
/* leaflet custom */
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font:700 12.5px Inter,sans-serif}
.pin.sel{width:38px;height:38px;outline:3px solid rgba(255,197,51,.9)}
.pin.hotel{background:#15171c}
.me{width:18px;height:18px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,124,246,.25)}
.pop .ph{height:130px;background:var(--soft)}
.pop .bd{padding:10px 12px 12px}
.pop h4{margin:2px 0;font-size:16px;font-family:"Zen Kaku Gothic New"}
.pop p{margin:4px 0;color:var(--muted)}
.pop small{color:var(--c);font-weight:700}
.st-pop b{font-size:14px}
/* info */
.box{background:var(--soft);border-radius:16px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.checks{list-style:none;padding:0;margin:0}
.checks label{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--ver);flex:none}
.checks input:checked+span{text-decoration:line-through;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin-top:28px}
.mebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 10px 4px 4px;font-weight:600;font-size:13px;min-height:36px}
.mebtn:not(:has(.av)){padding:6px 12px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--p);color:#fff;font-weight:700;flex:none;vertical-align:middle;border:2px solid #fff}
.ov{position:fixed;inset:0;z-index:3000;background:rgba(10,12,20,.55);display:none;overflow:auto;padding:6vh 14px}
.ov.on{display:block}
.ov .sheet{max-width:460px;margin:0 auto;background:var(--bg);border-radius:22px;padding:22px;box-shadow:var(--sh)}
.ov h2{margin:0 0 4px;font-size:28px}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.who button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;border:2px solid var(--line);background:var(--bg)}
.who button[aria-pressed=true]{border-color:var(--ver)}
.fld{display:block;font-weight:600;font-size:14px;margin:6px 0 10px}.fld small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:15px/1.4 Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:44px;margin-top:6px}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.props{margin-top:28px;padding-top:6px;border-top:1px solid var(--line)}
.ph-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 12px;flex-wrap:wrap}
.prop{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.ph-row{display:flex;gap:10px;align-items:center}
.ph-row b{display:block;font-size:15.5px;line-height:1.25}
.ph-row small{color:var(--muted);font-size:12.5px}
.prop p{margin:8px 0 0;color:var(--muted);font-size:14px}
.like.on{background:var(--ver);border-color:var(--ver);color:#fff}
.like[disabled]{opacity:.5}
.likers{display:flex;align-items:center;gap:2px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.likers span{margin-left:6px}
.likers .av{margin-left:-6px}.likers .av:first-child{margin-left:0}
.pform{background:var(--soft);border-radius:16px;padding:14px;margin-top:14px}
.pform h3{margin:0;font-size:16px}
.prop-pin{border-radius:50%;transform:none}.prop-pin span{transform:none}
.pop .prop{border:0;padding:0;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:4000}
.toast.on{opacity:1}
.pinw{border:0;background:none;padding:0;cursor:pointer}
.pin.grp{outline:3px solid #fff;box-shadow:0 0 0 5px var(--c),0 3px 10px rgba(0,0,0,.3)}
.pin.prop{border-radius:50%;transform:none;width:28px;height:28px;border-style:dashed}.pin.prop span{transform:none}
.pin.sel{width:38px;height:38px;outline:3px solid rgba(255,197,51,.95)}
.maplibregl-popup-content{border-radius:16px;padding:0;overflow:hidden;box-shadow:var(--sh);font:14px/1.45 Inter,sans-serif;max-height:70vh;overflow-y:auto}
.maplibregl-popup-close-button{font-size:22px;width:32px;height:32px;color:#fff;text-shadow:0 1px 4px #000;z-index:2}
.pop{width:min(290px,80vw)}.pop .bd,.maplibregl-popup-content>.bd{padding:10px 12px 12px}.maplibregl-popup-content>.bd p{margin:4px 0;color:var(--muted)}
.msearch{position:relative;flex:0 1 330px;display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.16);border-radius:14px;padding:0 10px;color:var(--muted)}
.msearch input{border:0;background:none;margin:0;min-height:42px;padding:0}
#mres{position:absolute;left:0;right:0;top:46px;background:var(--bg);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
#mres button,.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--bg);padding:9px 12px}
#mres small,.sugg small{display:block;color:var(--muted);font-size:12px}
.mtop{flex-wrap:wrap}
.picking #map canvas{cursor:crosshair!important}
.lpanel{width:290px;max-height:calc(100% - 80px);overflow:auto}
.lgrid{grid-template-columns:repeat(3,1fr)}
.lgrid button i{background-color:#ddd}
.lnote{font-size:12px;color:var(--muted);margin:8px 0 0}
.me{width:18px;height:18px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 7px rgba(47,124,246,.25)}
.by{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin:4px 0}
.card p.pl{color:var(--ink)}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-decoration:none;color:inherit}
.mini b{display:block;font-size:14.5px}.mini small{color:var(--muted);font-size:12.5px}.mini em{font-style:normal;font-weight:700;color:var(--ver)}
.np{color:var(--ver)}
.pgroup{border-left:3px dashed var(--line);margin:4px 0 8px 26px;padding-left:12px}
.plab{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 8px}
.prop{background:var(--bg);border-left:4px solid var(--p)}
.prop .ph-row small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.okrow{display:inline-flex;gap:6px;align-items:center}.okrow input{width:96px;margin:0;min-height:38px;padding:4px 8px}
.btn.ok{background:#e8f6ee;border-color:#bfe5cd;color:#16683a}
.add{width:100%;border:1px dashed #c9ccd3;background:none;border-radius:12px;padding:9px;color:var(--muted);font-weight:600;margin:2px 0 6px;min-height:42px}
.pday{border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px}
.pdh{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:inherit;margin-bottom:8px;flex-wrap:wrap}
.pdh .n{background:var(--c);color:#fff;border-radius:99px;font-weight:700;font-size:12px;padding:2px 8px}.pdh small{color:var(--muted)}
.pcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pcell{background:var(--soft);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
.pcell>span{font-size:11px;font-weight:700;color:var(--muted)}
.pi{display:block;background:var(--bg);border-radius:7px;padding:5px 6px;font-size:12.5px;line-height:1.3;text-decoration:none;color:var(--ink)}
.pi.grp{box-shadow:inset 0 0 0 2px #bfe5cd}.pi.pp{border-left:3px solid var(--p);color:var(--muted)}.pi em{font-style:normal;color:var(--ver);font-weight:700}
.pi .av{width:16px!important;height:16px!important;font-size:9px!important;border-width:1px}
.padd{border:1px dashed #c9ccd3;background:none;border-radius:7px;min-height:30px;color:var(--muted);font-weight:700}
.row2b{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.ov form label{display:block;font-weight:600;font-size:14px;margin-top:10px}.ov form small{font-weight:400;color:var(--muted)}
.sugg{border-radius:12px;overflow:hidden;margin-top:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.posok{font-size:12.5px;color:var(--muted);margin-top:6px}
@media(max-width:860px){.msearch{flex:1 1 100%}.layers{top:118px}.lpanel{top:118px;right:66px;width:min(290px,calc(100vw - 90px))}.pcols{gap:4px}.pi{font-size:11.5px;padding:4px 5px}.pcell{padding:4px}.pgroup{margin-left:8px}}
.apk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;background:#15171c;color:#fff;border-radius:16px;padding:14px;margin:0 0 16px}.apk small{display:block;color:#c9ccd3;font-size:12.5px;line-height:1.4}.apk .btn{grid-column:1/-1;justify-content:center;background:var(--ver);border-color:var(--ver);color:#fff}
.leg{margin:2px 0 10px 64px;font-size:13.5px;color:var(--muted)}
.leg>summary,div.leg{display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none;padding:6px 10px;border-radius:12px;background:var(--soft);flex-wrap:wrap}
.leg>summary::-webkit-details-marker{display:none}
.leg>summary b{color:var(--ink)}.leg em{font-style:normal;color:var(--ver);font-weight:600;margin-left:4px}
.leg[open]>summary{border-radius:12px 12px 0 0}
.leg[open]{background:var(--soft);border-radius:12px;padding-bottom:10px}
