# App Android (cartella android/): una Trusted Web Activity che apre il sito. Compila l'APK sui runner di GitHub
# e lo mette nella release «android», con un link fisso:
# https://github.com/AngeloBerardi/big-in-japan/releases/download/android/big-in-japan.apk
name: App Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'icon.svg']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.10.2' }
      - name: Compila e firma
        run: |
          set -o pipefail
          if ! gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            { echo '### Errore di compilazione'; echo '```'; grep -A25 -E 'What went wrong|FAILURE|error:' build.log | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" big-in-japan.apk
      - uses: actions/upload-artifact@v6
        with: { name: big-in-japan-apk, path: big-in-japan.apk }
      - name: Release «android» con il link fisso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { gh release view android >/dev/null 2>&1 || gh release create android --title "App Android" --notes "APK di Big in Japan: scaricalo dal telefono e installalo."; gh release upload android big-in-japan.apk --clobber; } 2>&1 | tee release.log
      - name: Log su ramo ci-log se qualcosa fallisce
        if: failure()
        run: |
          mkdir -p /tmp/l && cp build.log release.log /tmp/l/ 2>/dev/null || true
          ls -la android/app/build/outputs/apk/release/ > /tmp/l/apk.txt 2>&1 || true
          git config user.email ci@example.com && git config user.name ci
          git checkout --orphan ci-log && git rm -rqf . && cp /tmp/l/* . && git add -A && git commit -qm "log $GITHUB_RUN_NUMBER" && git push -f origin ci-log
