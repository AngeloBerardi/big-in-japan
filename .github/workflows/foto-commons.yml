name: Foto da Commons
on:
  workflow_dispatch:
    inputs:
      solo: { required: false, default: '' }
permissions: { contents: write }
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python tools/foto-commons.py ${{ inputs.solo }}
      - run: |
          git config user.name "foto-bot"; git config user.email "bot@users.noreply.github.com"
          git add img/idee tools/foglio-foto.jpg; git commit -m "Foto delle schede da Wikimedia Commons" || exit 0
          git pull --rebase origin main; git push
