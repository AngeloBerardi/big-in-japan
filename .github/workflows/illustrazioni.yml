name: Genera illustrazioni
on:
  workflow_dispatch:
    inputs:
      solo: { required: false, default: '' }
permissions: { contents: write }
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python tools/genera-illustrazioni.py ${{ inputs.solo }}
      - run: |
          git config user.name "illustrazioni-bot"; git config user.email "bot@users.noreply.github.com"
          git add img/idee; git commit -m "Illustrazioni delle schede" || exit 0
          git pull --rebase origin main; git push
